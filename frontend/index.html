<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estante Viva</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__left">
        <div class="logo">Estante Viva</div>
      </div>

      <div class="header__right">
        <input id="searchInput" class="input" placeholder="Buscar por título/autor..." />
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h3>Filtros</h3>

        <label class="label">Categoria</label>
        <select id="categorySelect" class="input">
          <option value="">Todas</option>
        </select>

        <label class="checkbox">
          <input id="stockCheckbox" type="checkbox" />
          Em estoque
        </label>

        <button id="applyFiltersBtn" class="btn">Aplicar</button>
        <button id="clearFiltersBtn" class="btn btn--ghost">Limpar</button>
      </aside>

      <section class="content">
        <div class="content__top">
          <h2>Livros</h2>
          <div id="status" class="status"></div>
        </div>

        <div id="booksGrid" class="grid"></div>

        <section class="add">
          <h3>Adicionar livro</h3>
          <form id="addBookForm" class="form">
            <input name="title" class="input" placeholder="Título*" required />
            <input name="author" class="input" placeholder="Autor*" required />
            <input name="category" class="input" placeholder="Categoria*" required />

            <input name="price" class="input" type="number" step="0.01" min="0" placeholder="Preço* (>= 0)" required />
            <input name="stock" class="input" type="number" step="1" min="0" placeholder="Estoque* (>= 0)" required />

            <input name="image" class="input" placeholder="Imagem (URL opcional)" />

            <button class="btn" type="submit">Salvar</button>
          </form>
        </section>
      </section>
    </main>

    <!-- Modal de detalhes -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal">
        <button id="closeModalBtn" class="modal__close">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="js/script.js" defer></script>
  </body>
</html>
