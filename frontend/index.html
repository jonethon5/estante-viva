<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estante Viva — MVP</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      /* HEADER */
      .header {
        background: #1a1a2e;
        color: white;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .logo {
        font-size: 20px;
        font-weight: bold;
        color: #4ecca3;
      }
      .header input {
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        width: 280px;
        font-size: 14px;
      }

      /* LAYOUT */
      .layout {
        display: flex;
        gap: 16px;
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* SIDEBAR */
      .sidebar {
        width: 200px;
        flex-shrink: 0;
        background: white;
        border-radius: 8px;
        padding: 16px;
        height: fit-content;
      }
      .sidebar h3 {
        margin-bottom: 12px;
        font-size: 16px;
      }
      .sidebar label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
        color: #666;
      }
      .sidebar select,
      .sidebar input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 8px;
        background: #1a1a2e;
        color: white;
      }
      .btn--ghost {
        background: white;
        color: #1a1a2e;
        border: 1px solid #1a1a2e;
      }

      /* CONTENT */
      .content {
        flex: 1;
      }
      .content__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .status {
        font-size: 13px;
        color: #666;
      }

      /* GRID */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .card {
        background: white;
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 4px;
        margin-bottom: 8px;
        background: #eee;
      }
      .card h3 {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .card p {
        font-size: 12px;
        color: #666;
        margin-bottom: 2px;
      }
      .card .price {
        font-size: 14px;
        font-weight: bold;
        color: #4ecca3;
        margin: 8px 0;
      }
      .card .btn-delete {
        width: 100%;
        padding: 6px;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .card .btn-delete:hover {
        background: #cc0000;
      }

      /* FORM */
      .add {
        background: white;
        border-radius: 8px;
        padding: 20px;
        margin-top: 16px;
      }
      .add h3 {
        margin-bottom: 16px;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .form input {
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
      }
      .form input:focus {
        outline: 2px solid #4ecca3;
        border-color: transparent;
      }
      .form .btn-submit {
        grid-column: span 2;
        padding: 10px;
        background: #4ecca3;
        color: #1a1a2e;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }
      .form .btn-submit:hover {
        background: #38b28e;
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-overlay.hidden {
        display: none;
      }
      .modal {
        background: white;
        border-radius: 10px;
        padding: 24px;
        width: 90%;
        max-width: 480px;
        position: relative;
      }
      .modal__close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #666;
      }

      /* RESPONSIVO */
      @media (max-width: 768px) {
        .layout {
          flex-direction: column;
          padding: 12px;
        }
        .sidebar {
          width: 100%;
        }
        .form {
          grid-template-columns: 1fr;
        }
        .form .btn-submit {
          grid-column: span 1;
        }
        .header input {
          width: 160px;
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">📚 Estante Viva</div>
      <input
        id="searchInput"
        type="text"
        placeholder="Buscar por título ou autor..."
      />
    </header>

    <main class="layout">
      <!-- SIDEBAR DE FILTROS -->
      <aside class="sidebar">
        <h3>Filtros</h3>

        <label>Categoria</label>
        <select id="categorySelect">
          <option value="">Todas</option>
          <option value="Fantasia">Fantasia</option>
          <option value="Tecnologia">Tecnologia</option>
          <option value="Suspense">Suspense</option>
          <option value="Programação">Programação</option>
          <option value="História">História</option>
        </select>

        <label class="checkbox-label">
          <input id="stockCheckbox" type="checkbox" />
          Em estoque
        </label>

        <button id="applyFiltersBtn" class="btn">Aplicar filtros</button>
        <button id="clearFiltersBtn" class="btn btn--ghost">Limpar</button>
      </aside>

      <!-- CONTEÚDO PRINCIPAL -->
      <section class="content">
        <div class="content__top">
          <h2>Livros</h2>
          <div id="status" class="status"></div>
        </div>

        <!-- GRID DE LIVROS -->
        <div id="booksGrid" class="grid"></div>

        <!-- FORM DE ADICIONAR -->
        <section class="add">
          <h3>Adicionar livro</h3>
          <form id="addBookForm" class="form">
            <input name="title" placeholder="Título*" required />
            <input name="author" placeholder="Autor*" required />
            <input name="category" placeholder="Categoria*" required />
            <input
              name="price"
              type="number"
              step="0.01"
              min="0"
              placeholder="Preço*"
              required
            />
            <input
              name="stock"
              type="number"
              step="1"
              min="0"
              placeholder="Estoque*"
              required
            />
            <input name="image" placeholder="URL da imagem (opcional)" />
            <button class="btn-submit" type="submit">Salvar livro</button>
          </form>
        </section>
      </section>
    </main>

    <!-- MODAL DE DETALHES -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal">
        <button id="closeModalBtn" class="modal__close">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="js/script.js" type="module" defer></script>
  </body>
</html>
